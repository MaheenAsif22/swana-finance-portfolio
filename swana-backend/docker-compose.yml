version: '3.9'

services:
  api:
    build:
      context: ./swana-backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 30d
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
    volumes:
      - db_data:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
